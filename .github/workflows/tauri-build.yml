name: Tauri Release Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            target: x86_64-pc-windows-msvc
          - platform: x86
            target: i686-pc-windows-msvc
          - platform: arm64
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install

      - name: Auto Bump Version
        run: node scripts/bump-version.js

      - name: Build Tauri App (NSIS Bundle)
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Package Artifacts
        id: package
        shell: pwsh
        run: |
          $appVer = (Get-Content package.json | ConvertFrom-Json).version
          $outDir = "dist-release-${{ matrix.platform }}"
          New-Item -ItemType Directory -Path $outDir -Force
          $nsisExe = Get-ChildItem -Path "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsisExe) {
            Copy-Item $nsisExe.FullName "$outDir/SuPS-${{ matrix.platform }}-v$appVer-Setup.exe"
            Copy-Item $nsisExe.FullName "SuPS-${{ matrix.platform }}-v$appVer-Setup.exe"
            Write-Output "SETUP_NAME=SuPS-${{ matrix.platform }}-v$appVer-Setup.exe" >> $env:GITHUB_ENV
          } else {
            Copy-Item "src-tauri/target/${{ matrix.target }}/release/su-profile-switcher.exe" "$outDir/SuPS-${{ matrix.platform }}-v$appVer.exe"
          }
          $zipName = "SuPS-${{ matrix.platform }}-v$appVer.zip"
          Compress-Archive -Path "$outDir/*" -DestinationPath $zipName
          Write-Output "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          Write-Output "APP_VER=v$appVer" >> $env:GITHUB_ENV
          Write-Output "app_ver=v$appVer" >> $env:GITHUB_OUTPUT
          Write-Output "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuPS-${{ matrix.platform }}
          path: |
            SuPS-${{ matrix.platform }}-*.exe
            SuPS-${{ matrix.platform }}-*.zip
          if-no-files-found: error

  release:
    name: Publish Release & Changelog
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate Changelog Between Releases
        id: changelog
        shell: bash
        run: |
          APP_VER="v$(node -p "require('./package.json').version")"
          echo "tag_name=$APP_VER" >> $GITHUB_OUTPUT

          # Lay danh sach commit giua release gan nhat va HEAD
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "Previous tag: $LAST_TAG"
          
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))")
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))")
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="* Không có commit mới kể từ bản phát hành trước."
          fi

          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag_name }}
          name: SketchUp Profile Switcher ${{ steps.changelog.outputs.tag_name }}
          body: |
            ### 📋 Nhật ký thay đổi (Changelog):
            ${{ steps.changelog.outputs.CHANGELOG }}

            ---
            *Bản phát hành tự động biên dịch đa kiến trúc (x64, x86 32-bit, arm64).*
          draft: false
          prerelease: false
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
