name: Tauri Release Build

on:
  push:
    branches: [ main, feat/tauri ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, feat/tauri ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri App
        run: pnpm tauri build --no-bundle --target ${{ matrix.target }}

      - name: Package Artifacts
        shell: pwsh
        run: |
          $ver = (git rev-list --count HEAD)
          $outDir = "dist-release-${{ matrix.platform }}"
          New-Item -ItemType Directory -Path $outDir -Force
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/su-profile-switcher.exe" "$outDir/su-profile-switcher.exe"
          $zipName = "su-profile-switcher-tauri-v1.0.$ver-${{ matrix.platform }}.zip"
          Compress-Archive -Path "$outDir/*" -DestinationPath $zipName
          Write-Output "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: su-profile-switcher-tauri-${{ matrix.platform }}
          path: dist-release-${{ matrix.platform }}/*
          if-no-files-found: error
