name: Tauri Release Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: x64, runner: windows-latest, target: x86_64-pc-windows-msvc, bundle: nsis }
          - { platform: x86, runner: windows-latest, target: i686-pc-windows-msvc, bundle: nsis }
          - { platform: arm64, runner: windows-latest, target: aarch64-pc-windows-msvc, bundle: nsis }
          - { platform: macos-x64, runner: macos-15-intel, target: x86_64-apple-darwin, bundle: app }
          - { platform: macos-arm64, runner: macos-15, target: aarch64-apple-darwin, bundle: app }
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Import Apple signing certificate
        if: matrix.bundle == 'app' && env.APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
      - run: pnpm install --frozen-lockfile
      - name: Test frontend
        run: pnpm build
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Calculate release version
        run: node scripts/bump-version.js
      - name: Build signed updater bundle
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --config src-tauri/TauriRelease.json
      - name: Build test bundle
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Package Windows
        if: matrix.bundle == 'nsis'
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          $dir = "dist-release-${{ matrix.platform }}"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $installer = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          $name = "SuPS-${{ matrix.platform }}-v$ver-Setup.exe"
          Copy-Item $installer.FullName "$dir/$name"
          $update = $installer.FullName -replace '\.exe$', '.nsis.zip'
          if (Test-Path $update) {
            Copy-Item $update "$dir/SuPS-${{ matrix.platform }}-v$ver-Setup.nsis.zip"
            Copy-Item "$update.sig" "$dir/SuPS-${{ matrix.platform }}-v$ver-Setup.nsis.zip.sig"
          }
      - name: Package macOS
        if: matrix.bundle == 'app'
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./package.json').version")
          dir="dist-release-${{ matrix.platform }}"
          mkdir -p "$dir"
          app=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app' -print -quit)
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          ditto "$app" "$stage/$(basename "$app")"
          ln -s /Applications "$stage/Applications"
          dmg="$dir/SuPS-${{ matrix.platform }}-v$ver.dmg"
          hdiutil create -volname 'SketchUp Profile Switcher' -srcfolder "$stage" -format UDZO -ov "$dmg"
          if [[ -n "$APPLE_SIGNING_IDENTITY" && -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          fi
          archive=""
          if [[ -d "src-tauri/target/${{ matrix.target }}/release/bundle/macos" ]]; then
            archive=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app.tar.gz' -print -quit)
          fi
          if [[ -n "$archive" ]]; then
            name="SuPS-${{ matrix.platform }}-v$ver.app.tar.gz"
            cp "$archive" "$dir/$name"
            if [[ -f "$archive.sig" ]]; then cp "$archive.sig" "$dir/$name.sig"; fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SuPS-${{ matrix.platform }}
          path: dist-release-${{ matrix.platform }}/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Prepare release assets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/ReleaseManifest.js
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: SketchUp Profile Switcher ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: release-assets/*
