[package]
name = "su-profile-switcher"
version = "1.0.8"
description = "Fast, portable, lightweight SketchUp profile switcher"
authors = ["Senior Automation Engineer"]
edition = "2021"

[lib]
name = "su_profile_switcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2.2.0", default-features = false, features = ["deflate"] }
walkdir = "2"
sysinfo = "0.33"
ureq = { version = "2.9", features = ["json"] }
chrono = "0.4"
windows = { version = "0.57", features = ["Data_Xml_Dom", "UI_Notifications"] }
tauri-plugin-global-shortcut = "2"
